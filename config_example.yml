# SECURITY WARNING: keep the secret key used in production secret!
# Encryption secret key. In production, change to a random string, keep it secret, can be generated with the command below
# $ cat /dev/urandom | tr -dc A-Za-z0-9 | head -c 49;echo
SECRET_KEY:

# SECURITY WARNING: keep the bootstrap token used in production secret!
# Pre-shared token used by coco and guacamole to register service accounts, no longer uses the original registration/acceptance mechanism
BOOTSTRAP_TOKEN:

# Development env open this, when error occur display the full process track, Production disable it
# DEBUG mode. When DEBUG is enabled, more logs are shown when an error occurs
# DEBUG: true

# DEBUG, INFO, WARNING, ERROR, CRITICAL can set. See https://docs.djangoproject.com/en/1.10/topics/logging/
# Log level
# LOG_LEVEL: DEBUG
# LOG_DIR:

# Session expiration setting, Default 1 hour, Also set expired on on browser close
# Browser session expiration time, default 1 hour, can also be set to expire on browser close
# SESSION_COOKIE_AGE: 3600
# SESSION_EXPIRE_AT_BROWSER_CLOSE: false

# Database setting, Support sqlite3, mysql, postgres ....
# Database settings
# See https://docs.djangoproject.com/en/1.10/ref/settings/#databases

# SQLite setting:
# Use a single-file SQLite database
# DB_ENGINE: sqlite3
# DB_NAME:
# MySQL or postgres setting like:
# Use PostgreSQL as the database
DB_ENGINE: postgresql
DB_HOST: 127.0.0.1
DB_PORT: 5432
DB_USER: jumpserver
DB_PASSWORD:
DB_NAME: jumpserver

# When Django start it will bind this host and port
# ./manage.py runserver 127.0.0.1:8080
# Host and port to bind at runtime
HTTP_BIND_HOST: 0.0.0.0
HTTP_LISTEN_PORT: 8080
WS_LISTEN_PORT: 8070

# Ansible single-batch timeout (one ansible-runner execution, unit: seconds)
# JOB_TIMEOUT: the batch is terminated once it runs longer than this, regardless of whether output keeps coming
# IDLE_TIMEOUT: if no Ansible event or output occurs for this long in a row, the batch is considered stuck and terminated
# Setting either value to 0 disables only that limit
# ANSIBLE_RUNNER_JOB_TIMEOUT: 1800
# ANSIBLE_RUNNER_IDLE_TIMEOUT: 900

# Monitoring and timeouts for the whole automation task (unit: seconds)
# STALL_LOG_INTERVAL: how often to log hosts still executing a task; logging only, never terminates the task
# TASK_TIMEOUT: default max time for a single Ansible task on one host
#               if a task explicitly sets a timeout in the playbook, the playbook value takes precedence
# TOTAL_TIMEOUT: max time for the whole automation task (including all batches); once exceeded, the current and subsequent batches are stopped
# Setting a value to 0 disables the corresponding logging or timeout limit
# ANSIBLE_STALL_LOG_INTERVAL: 60
# ANSIBLE_AUTOMATION_TASK_TIMEOUT: 300
# ANSIBLE_AUTOMATION_TOTAL_TIMEOUT: 21600

# SSH gateway connection timeout (unit: seconds)
# Limits the total wait time for DNS resolution, TCP connection, SSH handshake and authentication when building a tunnel through the gateway
# Setting it to 0 does not add any extra timeout limit on top of JumpServer's, it is still bound by the default sshtunnel/Paramiko timeouts
# SSH_GATEWAY_CONNECT_TIMEOUT: 30

# SSH/switch remote_client diagnostic logging
# When enabled, outputs redacted connection, user-switch, command send/receive and gateway-stage information, and is automatically passed into the Ansible EE
# Recommended only as a temporary toggle for troubleshooting; allowed values: true/false
# JMS_REMOTE_CLIENT_DEBUG: false

# Use Redis as broker for celery and web socket
# Redis configuration
REDIS_HOST: 127.0.0.1
REDIS_PORT: 6379
# REDIS_PASSWORD:
# REDIS_DB_CELERY: 3
# REDIS_DB_CACHE: 4

# Vault storage, OpenBao is the default backend when enabled.
# OpenBao is built in as the default Vault backend; once enabled, make sure the OpenBao Server has already been initialized and authorized
# VAULT_ENABLED: true
# VAULT_BACKEND: openbao
# VAULT_OPENBAO_ADDR: http://openbao:8200
# VAULT_OPENBAO_MOUNT_POINT: pam
# VAULT_OPENBAO_TOKEN:
# VAULT_OPENBAO_TIMEOUT: 10

# LDAP/AD settings
# LDAP search page size
# AUTH_LDAP_SEARCH_PAGED_SIZE: 1000
#
# Periodic user sync
# Enable / disable
# AUTH_LDAP_SYNC_IS_PERIODIC: True
# Sync interval (unit: hours) (takes priority)
# AUTH_LDAP_SYNC_INTERVAL: 12
# Crontab expression
# AUTH_LDAP_SYNC_CRONTAB: * 6 * * *
#
# When logging in via LDAP, only allow users that are in the user list to authenticate against the LDAP Server
# AUTH_LDAP_USER_LOGIN_ONLY_IN_USERS: False
#
# If the following message appears in the logs during LDAP authentication, set this parameter to 0 (see https://www.python-ldap.org/en/latest/faq.html for details)
# In order to perform this operation a successful bind must be completed on the connection
# AUTH_LDAP_OPTIONS_OPT_REFERRALS: -1

# OTP settings
# OTP/MFA configuration
# OTP_VALID_WINDOW: 0
# OTP_ISSUER_NAME: JumpServer

# Enable periodic tasks
# PERIOD_TASK_ENABLED: True
#

# Whether to enable the Luna watermark
# SECURITY_WATERMARK_ENABLED: False

# Session expires after the browser tab is closed
# SESSION_EXPIRE_AT_BROWSER_CLOSE: False

# Renew the session on every API request
# SESSION_SAVE_EVERY_REQUEST: True

# Only allow users to log in from their originating source
# ONLY_ALLOW_AUTH_FROM_SOURCE: False

# Only allow existing users to log in; do not auto-create users after third-party authentication
# ONLY_ALLOW_EXIST_USER_AUTH: False

# Enable the face recognition XPACK feature
#FACE_RECOGNITION_ENABLED: true
#FACE_RECOGNITION_DISTANCE_THRESHOLD': 0.35
#FACE_RECOGNITION_COSINE_THRESHOLD': 0.95
