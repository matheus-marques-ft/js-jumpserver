---

version: 3


build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: "--ignore-certs"


images:
  # ansible-builder only supports RPM-based images (dnf); Debian-based images such as python:3.11-slim cannot be used
  base_image:
    name: quay.io/centos/centos:stream9

dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11

  # Keep in sync with pyproject.toml [tool.uv.sources]; do not use the official PyPI package
  ansible_core:
    package_pip: https://github.com/jumpserver-dev/ansible/archive/refs/tags/v2.16.18.3.zip
  ansible_runner:
    package_pip: https://github.com/jumpserver-dev/ansible-runner/archive/refs/tags/v2.4.0.2.zip

  python: requirements-python.txt
  system: bindep.txt

additional_build_files:
  - src: files/pip.conf
    dest: configs/
  - src: files/use-china-mirrors.sh
    dest: scripts/
  - src: ../../apps/libs/ansible/
    dest: jumpserver-ansible/
  - src: ansible.cfg
    dest: configs/

additional_build_steps:
  prepend_base:
    # The pip mirror must be injected as early as possible in the base stage, so that pip install in every subsequent stage goes through the mirror
    - COPY _build/configs/pip.conf /etc/pip.conf
    - COPY _build/scripts/use-china-mirrors.sh /tmp/use-china-mirrors.sh
    - RUN chmod +x /tmp/use-china-mirrors.sh && /tmp/use-china-mirrors.sh centos
    # freetds-devel, sshpass, etc. are in EPEL; dev packages such as postgresql-devel often require CRB
    - RUN $PKGMGR config-manager --set-enabled crb
    - RUN $PKGMGR install -y epel-release
    - RUN /tmp/use-china-mirrors.sh epel && $PKGMGR makecache -y
  append_final:
    - RUN mkdir -p /opt/jumpserver/apps
    - COPY _build/jumpserver-ansible/ /opt/jumpserver/apps/libs/ansible/
    - COPY _build/configs/ansible.cfg /etc/ansible/ansible.cfg
    - ENV PYTHONPATH=/opt/jumpserver/apps
    - ENV ANSIBLE_LIBRARY=/opt/jumpserver/apps/libs/ansible/modules
    - ENV ANSIBLE_FORCE_COLOR=True
    - ENV LC_ALL=C.UTF-8
    - ENV LANG=C.UTF-8
    # bindep [compile] already keeps the toolchain out of the final layer; this only cleans up the dnf cache written by PKGMGR_PRESERVE_CACHE
    - RUN $PKGMGR clean all && rm -rf /var/cache/dnf /var/cache/yum /root/.cache
