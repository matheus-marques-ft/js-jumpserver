---
- hosts: all
  # /opt/jumpserver/applets is created root-owned (mode 0755) by playbook_linux.yml's
  # `become: true` play - without it here too, this connects as the unprivileged SSH
  # login (e.g. ec2-user) and fails with "Permission denied" on every write under it.
  become: true
  vars:
    applet_name: chrome
    applet_zip_path: /dev/null

  tasks:
    - name: Remove any previous version of this applet
      ansible.builtin.file:
        path: "/opt/jumpserver/applets/{{ applet_name }}"
        state: absent

    - name: Create applet directory
      ansible.builtin.file:
        path: "/opt/jumpserver/applets/{{ applet_name }}"
        state: directory
        mode: "0755"

    - name: Extract applet package
      ansible.builtin.unarchive:
        src: "{{ applet_zip_path }}"
        dest: "/opt/jumpserver/applets/{{ applet_name }}"
