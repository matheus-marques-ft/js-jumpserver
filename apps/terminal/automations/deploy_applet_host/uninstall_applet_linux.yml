---
- hosts: all
  # See install_applet_linux.yml - /opt/jumpserver/applets is root-owned, this needs
  # become: true too or the removal fails with "Permission denied".
  become: true
  vars:
    applet_name: chrome

  tasks:
    - name: Remove applet
      ansible.builtin.file:
        path: "/opt/jumpserver/applets/{{ applet_name }}"
        state: absent
