{% load i18n %}
{% spaceless %}
    <div class="captcha-hint" style="color: #8f959e; font-size: 13px; margin-bottom: 8px; text-align: left;">
        {% trans "Captcha" %}
    </div>
    <div class="captcha-wrapper" style="display: flex; align-items: center; gap: 12px; width: 100%;">
        <img src="{{ image }}" alt="captcha" class="captcha" />
        <div style="flex: 1; min-width: 0;">
            <div class="input-group-prepend">
                {% if audio %}
                    <a title="{% trans "Play CAPTCHA as audio file" %}" href="{{ audio }}"></a>
                {% endif %}
                </div>
            {% include "django/forms/widgets/multiwidget.html" %}
         </div>
    </div>
    <script>
        function refresh_captcha() {
            $.getJSON("{% url "captcha-refresh" %}",
                function (result) {
                    $('.captcha').attr('src', result['image_url']);
                    $('#id_captcha_0').val(result['key'])
                })
        }
        $(document).ready(function () {
            $('.captcha').click(refresh_captcha)
            $('#id_captcha_1').addClass('form-control')
        })
    </script>

{% endspaceless %}
