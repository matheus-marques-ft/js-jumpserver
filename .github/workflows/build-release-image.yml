name: Build and Publish Release Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      IMAGE_TAG:
        description: 'Tag to publish (defaults to the pushed git tag)'
        required: false
        default: ''
      PLATFORMS:
        description: 'Platforms to build'
        type: string
        default: 'linux/arm64'

env:
  REGISTRY: ghcr.io
  # VARIÁVEL: nome final da imagem (o único valor que muda por repo)
  # core (js-jumpserver) | koko | lion | chen | lina | luna
  IMAGE_NAME: core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image vars
        id: vars
        run: |
          TAG="${{ github.event.inputs.IMAGE_TAG }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          PLATFORMS="${{ github.event.inputs.PLATFORMS }}"
          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="linux/arm64"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.vars.outputs.platforms }}
          push: true
          build-args: VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:latest
