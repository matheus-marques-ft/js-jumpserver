name: Build and Push Ansible Executor Image

on:
  pull_request:
    branches:
        - 'dev'
        - 'dev_osm'
        - 'v*'
    paths:
        - utils/ansible_executor/**
        - apps/libs/ansible/**
    types:
        - opened
        - synchronize
        - reopened
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch used to build the Ansible Executor image'
        required: true
        type: string
        default: 'main'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Lock Pull Request
        if: github.event_name == 'push'
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d '{"state":"pending", "description":"Action running, merge disabled", "context":"Lock PR"}' \
          "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract date
        id: vars
        run: echo "IMAGE_TAG=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Extract repository owner
        id: owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Install ansible-builder
        run: pip install 'ansible-builder>=3.1.1'

      - name: Create Executor build context
        run: |
          ansible-builder create \
            -f utils/ansible_executor/execution-environment.yml \
            -c utils/ansible_executor/context

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          context: utils/ansible_executor/context
          file: utils/ansible_executor/context/Containerfile
          tags: |
            ghcr.io/${{ env.OWNER }}/ansible-executor:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER }}/ansible-executor:latest
